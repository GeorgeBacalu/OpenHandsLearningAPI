services:
  - type: web
    name: openhandslearning-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /openapi.json
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_JDBC_URL
        sync: false
      - key: POSTGRES_USERNAME
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: NEON_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: NEON_STORAGE_SECRET_ACCESS_KEY
        sync: false
