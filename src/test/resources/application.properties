# Exercise the real schema without requiring a local PostgreSQL service.
spring.datasource.url=jdbc:h2:mem:openhands-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USERS
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=optional:classpath:test-data.sql
app.timezone=Europe/Bucharest
