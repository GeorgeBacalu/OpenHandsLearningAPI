spring.profiles.default=dev
spring.profiles.group.render=prod
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false

app.storage.s3.region=us-east-1
app.storage.s3.bucket=open-hands-learning
app.storage.s3.endpoint=
app.storage.s3.access-key=${AWS_ACCESS_KEY:}
app.storage.s3.secret-key=${AWS_SECRET_ACCESS:}
app.storage.s3.public-base-url=https://${app.storage.s3.bucket}.s3.${app.storage.s3.region}.amazonaws.com/
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
