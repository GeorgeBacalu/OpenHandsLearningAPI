# Production runs on Neon; there is no local production database.
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.flyway.enabled=true

app.storage.s3.environment=prod
app.storage.s3.region=eu-central-1
app.storage.s3.bucket=openhandslearning-media
app.storage.s3.endpoint=https://br-red-base-b9fi1yrl.storage.c-7.eu-central-1.aws.neon.tech
app.storage.s3.access-key=${NEON_STORAGE_ACCESS_KEY_ID}
app.storage.s3.secret-key=${NEON_STORAGE_SECRET_ACCESS_KEY}
app.storage.s3.public-base-url=${app.storage.s3.endpoint}/${app.storage.s3.bucket}/
